<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
    <p class="site-footer__links">
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      {% if site.linkedin_username and site.linkedin_username != "" %}
        · <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener">LinkedIn</a>
      {% endif %}
      · <a href="{{ site.resume_pdf | relative_url }}" target="_blank" rel="noopener">Resume (PDF)</a>
    </p>
  </div>
</footer>
