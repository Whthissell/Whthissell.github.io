# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: William Thissell
tagline: "Aerospace Engineering Student @ UVA"
description: >-
  Engineering portfolio of William Thissell, an Aerospace Engineering student
  at the University of Virginia: rocket propulsion, a hybrid perching drone,
  and an algorithmic trading and research platform.

url: "https://whthissell.github.io"
baseurl: ""

author:
  name: William Thissell
  email: whthissell@gmail.com

# Shown in the footer and on the About page. Leave empty to hide.
linkedin_username: "william-thissell-6a6b55318"

resume_pdf: /assets/William_Thissell_Resume.pdf

nav:
  - title: Projects
    url: /#projects
  - title: About
    url: /about/
  - title: Resume
    url: /resume/

markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - ".github"
